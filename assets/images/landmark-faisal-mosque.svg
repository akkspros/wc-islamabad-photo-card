<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470">
  <defs>
    <linearGradient id="fmL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3e9cb"/><stop offset="1" stop-color="#dccfa8"/></linearGradient>
    <linearGradient id="fmR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6caa8"/><stop offset="1" stop-color="#b8aa86"/></linearGradient>
    <linearGradient id="fmGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd37a"/><stop offset="0.6" stop-color="#f0a53a"/><stop offset="1" stop-color="#d9822a"/></linearGradient>
    <linearGradient id="fmMin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf5e3"/><stop offset="0.55" stop-color="#eee3c4"/><stop offset="1" stop-color="#bfb18c"/></linearGradient>
    <linearGradient id="fmDeck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3d8ba"/><stop offset="1" stop-color="#b7a984"/></linearGradient>
    <g id="minaret">
      <!-- shaft -->
      <rect x="-8" y="70" width="16" height="340" fill="url(#fmMin)"/>
      <!-- pencil cap -->
      <polygon points="-8,70 0,-6 8,70" fill="url(#fmMin)"/>
      <polygon points="0,-6 8,70 0,70" fill="#b3a57f" opacity=".55"/>
      <!-- balconies -->
      <rect x="-15" y="96" width="30" height="7" rx="2" fill="#f7f0db"/>
      <rect x="-15" y="103" width="30" height="3" fill="#a99b76"/>
      <rect x="-14" y="175" width="28" height="6" rx="2" fill="#f7f0db"/>
      <rect x="-14" y="181" width="28" height="3" fill="#a99b76"/>
      <rect x="-14" y="262" width="28" height="6" rx="2" fill="#f7f0db"/>
      <rect x="-14" y="268" width="28" height="3" fill="#a99b76"/>
      <!-- slits -->
      <rect x="-1.6" y="116" width="3.2" height="40" rx="1.6" fill="#8d7f5c" opacity=".55"/>
      <rect x="-1.6" y="196" width="3.2" height="50" rx="1.6" fill="#8d7f5c" opacity=".55"/>
      <rect x="-1.6" y="284" width="3.2" height="60" rx="1.6" fill="#8d7f5c" opacity=".55"/>
      <!-- base block -->
      <rect x="-13" y="396" width="26" height="22" fill="#e9dfc2"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="280" cy="452" rx="262" ry="10" fill="#000" opacity=".18"/>

  <!-- back minarets (slightly shorter, paler) -->
  <g opacity=".92">
    <use href="#minaret" transform="translate(112,44) scale(1,.92)"/>
    <use href="#minaret" transform="translate(448,44) scale(1,.92)"/>
  </g>

  <!-- platform / courtyard edge -->
  <rect x="70" y="426" width="420" height="24" fill="url(#fmDeck)"/>
  <rect x="70" y="426" width="420" height="4" fill="#f4ecd4"/>
  <rect x="86" y="418" width="388" height="10" fill="#ece2c5"/>

  <!-- tent-shaped prayer hall: shaded right plane, lit left plane -->
  <polygon points="273,128 487,418 280,418 280,128" fill="url(#fmR)"/>
  <polygon points="287,128 273,128 73,418 280,418 280,128" fill="url(#fmL)" stroke="#b3a57f" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="273,128 287,128 487,418 470,418" fill="#cfc3a0"/>
  <!-- roof ridge lines -->
  <polyline points="280,128 150,418" fill="none" stroke="#cdbf9b" stroke-width="1.6"/>
  <polyline points="280,128 410,418" fill="none" stroke="#a89a75" stroke-width="1.6"/>
  <polyline points="280,170 210,418" fill="none" stroke="#d8cca9" stroke-width="1.2"/>
  <polyline points="280,170 350,418" fill="none" stroke="#b4a681" stroke-width="1.2"/>

  <!-- glazed triangular facade -->
  <polygon points="280,150 196,418 364,418" fill="#fbf5e3"/>
  <polygon points="280,168 208,418 352,418" fill="url(#fmGlass)"/>
  <g stroke="#fff3cc" stroke-width="2" opacity=".85" fill="none">
    <line x1="280" y1="168" x2="280" y2="418"/>
    <line x1="280" y1="168" x2="250" y2="418"/><line x1="280" y1="168" x2="310" y2="418"/>
    <line x1="280" y1="168" x2="228" y2="418"/><line x1="280" y1="168" x2="332" y2="418"/>
    <line x1="238" y1="300" x2="322" y2="300"/>
    <line x1="224" y1="350" x2="336" y2="350"/>
    <line x1="252" y1="236" x2="308" y2="236"/>
  </g>
  <!-- inner glow doorway -->
  <path d="M252,418 L252,372 Q280,340 308,372 L308,418 Z" fill="#6b3f12" opacity=".55"/>

  <!-- colonnade across the base -->
  <rect x="96" y="388" width="368" height="32" fill="#efe6cb"/>
  <g fill="#8a7a52" opacity=".75">
    <rect x="108" y="394" width="9" height="24" rx="4.5"/><rect x="132" y="394" width="9" height="24" rx="4.5"/>
    <rect x="156" y="394" width="9" height="24" rx="4.5"/><rect x="180" y="394" width="9" height="24" rx="4.5"/>
    <rect x="204" y="394" width="9" height="24" rx="4.5"/><rect x="228" y="394" width="9" height="24" rx="4.5"/>
    <rect x="323" y="394" width="9" height="24" rx="4.5"/><rect x="347" y="394" width="9" height="24" rx="4.5"/>
    <rect x="371" y="394" width="9" height="24" rx="4.5"/><rect x="395" y="394" width="9" height="24" rx="4.5"/>
    <rect x="419" y="394" width="9" height="24" rx="4.5"/><rect x="443" y="394" width="9" height="24" rx="4.5"/>
  </g>
  <rect x="96" y="386" width="368" height="4" fill="#fffaf0"/>

  <!-- finial: pole and crescent -->
  <line x1="280" y1="128" x2="280" y2="86" stroke="#d6a23c" stroke-width="3"/>
  <circle cx="280" cy="76" r="12" fill="#e8b84a"/>
  <circle cx="284" cy="73" r="10" fill="#fbf5e3"/>
  <circle cx="281" cy="75" r="2.2" fill="#e8b84a"/>

  <!-- front minarets (tallest, in front of hall wings) -->
  <use href="#minaret" transform="translate(58,22)"/>
  <use href="#minaret" transform="translate(502,22)"/>

  <!-- soft green uplight on minarets -->
  <rect x="49" y="120" width="5" height="250" fill="#5ed49a" opacity=".22"/>
  <rect x="493" y="120" width="5" height="250" fill="#5ed49a" opacity=".22"/>
</svg>
