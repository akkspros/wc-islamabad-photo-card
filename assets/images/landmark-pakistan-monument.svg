<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400">
  <defs>
    <linearGradient id="pmShell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f2a2a"/><stop offset="1" stop-color="#a24a3a"/></linearGradient>
    <linearGradient id="pmShell2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a3a32"/><stop offset="1" stop-color="#b5584a"/></linearGradient>
    <linearGradient id="pmGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.55" stop-color="#f1a640"/><stop offset="1" stop-color="#cf7a28"/></linearGradient>
    <linearGradient id="pmGold2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0a0"/><stop offset="1" stop-color="#e79a36"/></linearGradient>
    <linearGradient id="pmBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d2b4"/><stop offset="1" stop-color="#a99879"/></linearGradient>
    <g id="pmLeft">
      <!-- large outer petal: maroon shell (outside) -->
      <path d="M6,366 C4,228 100,96 272,24 C246,80 214,158 204,366 Z" fill="url(#pmShell)"/>
      <!-- lit golden inner face -->
      <path d="M64,366 C70,246 146,132 262,42 C232,106 214,198 208,366 Z" fill="url(#pmGold)"/>
      <!-- ornamental arches on the inner face -->
      <g fill="none" stroke="#8a4a1c" stroke-width="2" opacity=".55">
        <path d="M84,366 C92,262 156,158 252,66"/>
        <path d="M110,366 C118,280 168,190 242,92"/>
        <path d="M138,366 C144,296 182,222 232,122"/>
        <path d="M168,366 C172,310 192,252 222,168"/>
        <path d="M78,330 L206,320 M92,280 L210,264 M120,230 L216,214 M156,184 L226,170"/>
      </g>
      <!-- rim highlight -->
      <path d="M6,366 C4,228 100,96 272,24" fill="none" stroke="#c4705a" stroke-width="2.5" opacity=".7"/>
      <!-- medium petal -->
      <path d="M166,366 C170,262 222,168 300,98 C284,150 272,238 270,366 Z" fill="url(#pmShell2)"/>
      <path d="M196,366 C200,278 238,194 296,118 C284,172 278,250 276,366 Z" fill="url(#pmGold2)"/>
      <g fill="none" stroke="#8a4a1c" stroke-width="1.8" opacity=".5">
        <path d="M214,366 C218,290 246,214 290,142"/>
        <path d="M236,366 C240,302 258,240 284,176"/>
        <path d="M204,320 L274,306 M214,262 L280,246 M236,206 L286,192"/>
      </g>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="310" cy="392" rx="300" ry="9" fill="#000" opacity=".2"/>

  <!-- raised platform -->
  <rect x="0" y="366" width="620" height="26" fill="url(#pmBase)"/>
  <rect x="0" y="366" width="620" height="4" fill="#f3e7cc"/>
  <rect x="26" y="360" width="568" height="8" fill="#eadcbd"/>

  <!-- center small petals / spire -->
  <path d="M310,150 L292,366 L328,366 Z" fill="#7a2e2c"/>
  <path d="M310,168 L300,366 L320,366 Z" fill="url(#pmGold)"/>
  <path d="M292,366 C294,300 300,230 310,150" fill="none" stroke="#c4705a" stroke-width="2" opacity=".6"/>

  <!-- mirrored halves -->
  <use href="#pmLeft"/>
  <use href="#pmLeft" transform="translate(620,0) scale(-1,1)"/>

  <!-- warm light pooled on the floor -->
  <ellipse cx="310" cy="366" rx="240" ry="7" fill="#ffcf70" opacity=".5"/>
  <!-- eternal-flame bowl at the front -->
  <ellipse cx="310" cy="384" rx="46" ry="6" fill="#6a6252"/>
  <ellipse cx="310" cy="380" rx="40" ry="5" fill="#8d8571"/>
  <ellipse cx="310" cy="378" rx="30" ry="3" fill="#f3b04a" opacity=".85"/>
</svg>
