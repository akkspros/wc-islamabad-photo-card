name: Build release ZIP

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          SLUG=wc-islamabad-photo-card
          mkdir -p build/$SLUG
          rsync -a --exclude-from=.distignore ./ build/$SLUG/
          cd build && zip -r ../$SLUG.zip $SLUG
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: wc-islamabad-photo-card.zip
          generate_release_notes: true
